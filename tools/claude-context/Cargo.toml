[package]
name = "claude-context"
version = "0.1.0"
edition = "2021"
description = "Smart per-project context manager for AI coding CLIs"
license = "MIT"
authors = ["Jerome Soyer"]

[[bin]]
name = "claude-context"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# File system
walkdir = "2"
glob = "0.3"

# User interaction (non-TUI confirmations)
dialoguer = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
dirs = "6"
colored = "3"

# File watching
notify = "7"

[dependencies.reqwest]
version = "0.12"
features = ["json", "blocking"]
optional = true

[features]
default = []
ai = ["reqwest"]

[profile.release]
opt-level = "z"
lto = true
strip = true
