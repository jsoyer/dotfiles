# fleet.yml — fleet-updates inventory (one entry per tailnet machine that gets updates).
#
# Format: restricted YAML subset, see dot_local/share/fleet/lib/inventory.py
# (block mappings, one-line [a, b] lists and {k: v} maps, no block sequences).
# Validated by `fleet` on every run; a bad value rejects the whole file.
#
# kind : chezmoi-linux chezmoi-macos omv pikvm homeassistant opnsense proxmox windows guardian
# site : dijon nice garage cloud mobile
# critical: true if and only if kind is opnsense or proxmox (validator enforces it)
# Do NOT put a trailing comment on kind:/site: lines (INVARIANTS.md greps them);
# uncertain values are flagged by a "# UNCERTAIN" comment on the line above.
#
# Built from `tailscale status --json` on 2026-10-30. iOS devices are not part of
# the fleet and are left out. ssh_user is provisional (fleet bootstrap / sprint 3
# and 5 set it for omv, pikvm, windows, macOS); a host without ssh_user has no
# agent yet and `fleet check` reports it unsupported.
# critical_services is read on the target by the agent from
# ~/.config/fleet-agent/critical-services (deployed by a later sprint).

version: 1
masters: [diabolo, penelope]
# ntfy: server reached through the `gateway` host (phase 3, treated alone); the token
# is only an op:// reference, read at run time, never stored here. The url is a
# placeholder until the bbh-network server address is confirmed (UNCERTAIN).
ntfy: {url: "https://ntfy.sh", topic: fleet, token_ref: "op://Private/Fleet/ntfy-token", gateway: bbh-network}
# Console -> master choice per site of the targets (default: the first master, diabolo).
master_priority: {nice: penelope}
parallel: {total: 10, per_site: 4}
# API-only hosts (no agent, no ssh_user): lib/api_opnsense.py and lib/api_homeassistant.py.
# url: https://<name>.ts.net, or a literal tailnet IP (100.64.0.0/10, http allowed). Credentials are op:// references
# read at run time, never stored here or on disk. UNCERTAIN: the tailnet domain below is a
# placeholder, and the 1Password item fields must be created (dedicated minimal users:
# OPNsense user `fleet` with the single privilege "System: Firmware"; Home Assistant
# dedicated non-owner user with a long-lived token).
api:
  opnsense-amd64: {url: "https://opnsense-amd64.example-tailnet.ts.net", key_ref: "op://Private/Fleet/opnsense-api-key", secret_ref: "op://Private/Fleet/opnsense-api-secret"}
  ha-dijon: {url: "https://ha-dijon.example-tailnet.ts.net", token_ref: "op://Private/Fleet/ha-dijon-token"}
  ha-nice: {url: "https://ha-nice.example-tailnet.ts.net", token_ref: "op://Private/Fleet/ha-nice-token"}
  ha-garage: {url: "https://ha-garage.example-tailnet.ts.net", token_ref: "op://Private/Fleet/ha-garage-token"}

timeouts:
  chezmoi-linux: 30
  chezmoi-macos: 30
  omv: 30
  pikvm: 20
  homeassistant: 45
  windows: 120
  opnsense: 30
  proxmox: 45
  guardian: 30

