# Starship configuration for Raspberry Pi / Linux
# Snazzy theme - compact format with hostname-based icons

add_newline = false
command_timeout = 500
scan_timeout = 30

# Compact format: icon hostname:path ❯
format = """$env_var$hostname$directory$git_branch$git_status$character"""
palette = "snazzy"

# Custom icon based on hostname (set in 00-env.zsh)
[env_var.STARSHIP_ICON]
variable = "STARSHIP_ICON"
style = "bold"
format = "[$env_value]($style) "
disabled = false

[hostname]
ssh_only = false
format = " [$hostname](bold yellow):"
disabled = false

[directory]
truncation_length = 2
style = "bold cyan"
format = "[$path]($style) "

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold magenta"
symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
style = "bold yellow"

[golang]
format = 'via [ $version](bold cyan) '
disabled = false

[python]
format = 'via [🐍 $version](bold yellow) '
disabled = false

[nodejs]
format = "via [⬢ $version](bold green) "
disabled = false

[docker_context]
disabled = false
format = "via [🐋 $context](bold cyan) "

[kubernetes]
disabled = true

[aws]
disabled = true

# Disable right prompt modules that were showing
[username]
disabled = true

[palettes.snazzy]
red = "#ff5c57"
green = "#5af78e"
yellow = "#f3f99d"
blue = "#57c7ff"
magenta = "#ff6ac1"
cyan = "#9aedfe"
white = "#eff0eb"
black = "#282a36"
