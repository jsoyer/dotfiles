# Resource discovery sources for ai-context
# aictx fetches resource listings from these sources and caches locally
# resources: what types this source provides (default: [plugin])

sources:
  # ── Plugins ──────────────────────────────────────────────────────────
  - name: official
    type: github-marketplace
    repo: anthropics/claude-plugins-official
    refresh: 24h
    resources: [plugin]

  - name: community
    type: github-repo
    repo: jeremylongshore/claude-code-plugins-plus-skills
    refresh: 24h
    resources: [skill, agent, plugin]

  - name: claudemarketplaces
    type: web-catalog
    url: https://claudemarketplaces.com
    refresh: 24h
    resources: [skill, agent, command, plugin]

  - name: buildwithclaude
    type: web-catalog
    url: https://buildwithclaude.com
    refresh: 24h
    resources: [skill, agent, plugin]

  - name: awesome-plugins
    type: awesome-list
    repo: quemsah/awesome-claude-plugins
    refresh: 24h
    resources: [skill, agent, plugin]

  # ── Skills ───────────────────────────────────────────────────────────
  - name: skillhub
    type: web-catalog
    url: https://www.skillhub.club
    refresh: 24h
    resources: [skill]

  - name: skillsmp
    type: web-catalog
    url: https://skillsmp.com
    refresh: 24h
    resources: [skill]

  - name: awesome-agent-skills
    type: awesome-list
    repo: VoltAgent/awesome-agent-skills
    refresh: 24h
    resources: [skill, agent]

  - name: lobehub-skills
    type: web-catalog
    url: https://lobehub.com/skills
    refresh: 24h
    resources: [skill]

  - name: mcpmarket-skills
    type: web-catalog
    url: https://mcpmarket.com/tools/skills
    refresh: 24h
    resources: [skill]

  # ── Agents ───────────────────────────────────────────────────────────
  - name: awesome-subagents
    type: awesome-list
    repo: VoltAgent/awesome-claude-code-subagents
    refresh: 24h
    resources: [agent]

  - name: wshobson-agents
    type: github-repo
    repo: wshobson/agents
    refresh: 24h
    resources: [agent]

  - name: subagents-cc
    type: web-catalog
    url: https://subagents.cc
    refresh: 24h
    resources: [agent]

  - name: claudecodeagents
    type: web-catalog
    url: https://www.claudecodeagents.com
    refresh: 24h
    resources: [agent]
