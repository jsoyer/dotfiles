[general]
import = ["/Users/jeromesoyer/.config/alacritty/catppuccin-mocha.toml"]
#import = ["/Users/jeromesoyer/.config/alacritty/dracula.toml"]

[env]
TERM = "xterm-256color"

option_as_alt = "Both"

[window]
#dimensions            = { columns = 0, lines = 0 }
#position              = { x = 0, y = 0 }
padding               = { x = 10, y = 10 }
#dynamic_padding       = true
#decorations           = "None"
decorations           = "Buttonless"

opacity               = 0.7
blur                  = true
#startup_mode          = "Windowed"
#title                 = "Alacritty"
#dynamic_title         = true
#class                 = { instance = "Alacritty", general = "Alacritty" }
#decorations_theme_variant = "None"
#resize_increments     = false
#option_as_alt         = "None"


[scrolling]
history               = 65535
#multiplier            = 3

[font]
normal                = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold                  = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic                = { family = "FiraCode Nerd Font Mono", style = "Italic" }
bold_italic           = { family = "FiraCode Nerd Font Mono", style = "Bold Italic" }
size                  = 12
offset                = { x = 0, y = 0 }
glyph_offset          = { x = 0, y = 0 }
#builtin_box_drawing   = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true 
