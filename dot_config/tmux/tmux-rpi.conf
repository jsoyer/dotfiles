# ============================================================================
# Tmux configuration for Raspberry Pi
# Snazzy theme - Status bar at BOTTOM
# ============================================================================

source-file ~/.config/tmux/tmux.reset.conf

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^B
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g set-clipboard on
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# ============================================================================
# STATUS BAR AT BOTTOM
# ============================================================================
set -g status-position bottom

# ============================================================================
# Snazzy Theme
# ============================================================================
# Colors: bg=#282a36, fg=#eff0eb, red=#ff5c57, green=#5af78e
#         yellow=#f3f99d, blue=#57c7ff, magenta=#ff6ac1, cyan=#9aedfe

set -g status-style "bg=#282a36 fg=#eff0eb"
set -g status-left-length 50
set -g status-right-length 100

# Left: Raspberry icon + session name
set -g status-left "#[fg=#ff5c57,bold]🍓 #[fg=#f3f99d,bold]#S #[fg=#5af78e]│ "

# Right: hostname, date, time
set -g status-right "#[fg=#5af78e]│ #[fg=#57c7ff]#H #[fg=#5af78e]│ #[fg=#ff6ac1]%d/%m #[fg=#f3f99d]%H:%M "

# Window tabs
set -g window-status-format "#[fg=#9aedfe] #I:#W "
set -g window-status-current-format "#[fg=#282a36,bg=#57c7ff,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3a3d4d"
set -g pane-active-border-style "fg=#57c7ff"

# Message style
set -g message-style "bg=#57c7ff fg=#282a36"
set -g message-command-style "bg=#ff6ac1 fg=#282a36"

# Mode style (copy mode, etc.)
set -g mode-style "bg=#3a3d4d fg=#eff0eb"

# ============================================================================
# Plugins (lightweight for RPi)
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# Keybindings
# ============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ============================================================================

# ============================================================================
# Window naming
# ============================================================================
# Allow programs to change window name
set -g allow-rename on
# But don't let tmux auto-rename based on running command
set -g automatic-rename off
