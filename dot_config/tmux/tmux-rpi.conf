# ============================================================================
# Tmux configuration for Raspberry Pi
# Gruvbox Dark theme - Status bar at BOTTOM (different from macOS)
# ============================================================================

source-file ~/.config/tmux/tmux.reset.conf

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^B
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 100000
set -g renumber-windows on
set -g set-clipboard on
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# ============================================================================
# STATUS BAR AT BOTTOM (key difference from macOS)
# ============================================================================
set -g status-position bottom

# ============================================================================
# Gruvbox Dark Theme (different from Catppuccin on macOS)
# ============================================================================
# Colors
GRUVBOX_BG="#282828"
GRUVBOX_BG1="#3c3836"
GRUVBOX_BG2="#504945"
GRUVBOX_BG3="#665c54"
GRUVBOX_FG="#ebdbb2"
GRUVBOX_FG2="#d5c4a1"
GRUVBOX_RED="#cc241d"
GRUVBOX_GREEN="#98971a"
GRUVBOX_YELLOW="#d79921"
GRUVBOX_BLUE="#458588"
GRUVBOX_PURPLE="#b16286"
GRUVBOX_AQUA="#689d6a"
GRUVBOX_ORANGE="#d65d0e"

# Status bar style
set -g status-style "bg=#3c3836 fg=#ebdbb2"
set -g status-left-length 50
set -g status-right-length 100

# Left: Raspberry icon + session name
set -g status-left "#[fg=#cc241d,bold]🍓 #[fg=#d79921,bold]#S #[fg=#665c54]│ "

# Right: hostname, load average, time
set -g status-right "#[fg=#665c54]│ #[fg=#458588]#H #[fg=#665c54]│ #[fg=#98971a]%d/%m #[fg=#d79921]%H:%M "

# Window tabs
set -g window-status-format "#[fg=#a89984] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#d79921,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#d79921"

# Message style
set -g message-style "bg=#d79921 fg=#282828"
set -g message-command-style "bg=#458588 fg=#ebdbb2"

# Mode style (copy mode, etc.)
set -g mode-style "bg=#504945 fg=#ebdbb2"

# ============================================================================
# Plugins (lightweight for RPi)
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# Keybindings (same as macOS for consistency)
# ============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
