base:
  skills:
    - git-commit
    - git-workflow
    - code-review
    - code-refactoring
    - tdd-workflow
    - plan
    - verify
    - debugger
    - debugging-wizard
    - security-review
    - documentation
    - testing-strategy
    - refactor
    - search
    - deep-research
    - self-improvement
    - continuous-learning
    - prompt-engineer
    - health
    - context-budget
    - aside
    - build-fix
    - learn
    - checkpoint
    - save-session
    - resume-session

  agents:
    - code-reviewer
    - planner
    - debugger
    - security-reviewer
    - build-error-resolver
    - refactoring-specialist
    - tdd-guide
    - documentation-engineer
    - shell-script-engineer
    - performance-engineer
    - search-specialist
    - error-detective

  commands:
    - plan
    - verify
    - code-review
    - tdd
    - build-fix
    - refactor-clean
    - checkpoint
    - save-session
    - resume-session
    - context-budget
    - learn
    - aside
    - quality-gate
    - update-docs
    - update-codemaps

  # MCP selections are opt-in until server definitions are modeled explicitly.
  mcp: []

  rules:
    - common

  plugins: []
  theme: catppuccin-mocha

ai:
  enabled: false
  provider: ollama
  model: "qwen3:8b"
  fallback: claude
  max_tokens: 500
  cache_ttl: "7d"

paths:
  skills_dir: "~/.aictx/skills"
  agents_dir: "~/.aictx/agents"
  commands_dir: "~/.aictx/commands"
  hooks_dir: "~/.aictx/hooks"
  rules_dir: "~/.aictx/rules"
  config_dir: "~/.config/aictx"
  profiles_dir: "~/.config/aictx/profiles"

cli_registry:
  - name: claude
    config_dir: "~/.claude"
    project_dir: ".claude"
    supports: [skills, agents, commands, rules, mcp, plugins]
    scopes: [global, project, user-project]

  - name: qwen
    config_dir: "~/.qwen"
    project_dir: ".qwen"
    supports: [skills]
    detect: "which qwen"

  - name: vibe
    config_dir: "~/.vibe"
    project_dir: ".vibe"
    supports: [skills]
    detect: "which vibe"

  - name: codex
    config_dir: "~/.codex"
    project_dir: ".codex"
    supports: [skills]
    detect: "which codex"

  - name: kimi
    config_dir: "~/.kimi"
    project_dir: ".kimi"
    supports: [skills]
    detect: "which kimi"

  - name: opencode
    config_dir: "~/.config/opencode"
    project_dir: ".opencode"
    supports: [skills]
    detect: "which opencode"

  - name: gemini-cli
    config_dir: "~/.gemini"
    project_dir: ".gemini"
    supports: [skills]
    detect: "which gemini"

  - name: copilot-cli
    config_dir: "~/.copilot"
    project_dir: ".copilot"
    supports: [skills]
    detect: "which copilot"
