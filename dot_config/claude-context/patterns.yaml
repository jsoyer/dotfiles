# Scanner detection patterns for claude-context
# Add new patterns here without recompiling the binary

languages:
  - name: typescript
    extensions: [ts, tsx]
    config_files: [tsconfig.json]
  - name: javascript
    extensions: [js, jsx, mjs, cjs]
    config_files: [package.json]
  - name: rust
    extensions: [rs]
    config_files: [Cargo.toml]
  - name: go
    extensions: [go]
    config_files: [go.mod]
  - name: python
    extensions: [py]
    config_files: [pyproject.toml, setup.py, requirements.txt]
  - name: java
    extensions: [java]
    config_files: [pom.xml, build.gradle]
  - name: kotlin
    extensions: [kt, kts]
    config_files: [build.gradle.kts]
  - name: swift
    extensions: [swift]
    config_files: [Package.swift]
  - name: cpp
    extensions: [cpp, cc, cxx, hpp, h]
    config_files: [CMakeLists.txt]
  - name: csharp
    extensions: [cs]
    config_files: ["*.csproj", "*.sln"]
  - name: ruby
    extensions: [rb]
    config_files: [Gemfile]
  - name: php
    extensions: [php]
    config_files: [composer.json]
  - name: lua
    extensions: [lua]
    config_files: []
  - name: shell
    extensions: [sh, bash, zsh]
    config_files: [Brewfile]
  - name: nix
    extensions: [nix]
    config_files: [flake.nix]
  - name: elixir
    extensions: [ex, exs]
    config_files: [mix.exs]
  - name: dart
    extensions: [dart]
    config_files: [pubspec.yaml]
  - name: zig
    extensions: [zig]
    config_files: [build.zig]
  - name: haskell
    extensions: [hs]
    config_files: [stack.yaml, cabal.project]
  - name: scala
    extensions: [scala]
    config_files: [build.sbt]

