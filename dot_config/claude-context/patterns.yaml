  - name: vitest
    config_files: [vitest.config.ts, vitest.config.js]
  - name: playwright
    config_files: [playwright.config.ts, playwright.config.js]
  - name: cypress
    config_files: [cypress.config.ts, cypress.config.js]
  - name: storybook
    config_files: [.storybook/]
  - name: turbopack
    config_files: [turbo.json]
  - name: nx
    config_files: [nx.json, project.json]

ci:
  - name: github-actions
    config_files: [.github/workflows]
  - name: gitlab-ci
    config_files: [.gitlab-ci.yml]
  - name: jenkins
    config_files: [Jenkinsfile]
  - name: circleci
    config_files: [.circleci/config.yml]
