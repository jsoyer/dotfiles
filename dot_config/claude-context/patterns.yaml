infrastructure:
  - name: docker
    config_files: [Dockerfile, docker-compose.yml, docker-compose.yaml, compose.yml]
  - name: terraform
    config_files: [terraform.tf, main.tf, "*.tf"]
  - name: kubernetes
    config_files: [kubernetes.yaml, k8s/]
  - name: helm
    config_files: [Chart.yaml, charts/]
  - name: ansible
    config_files: [ansible.cfg, playbooks/]
  - name: cloudformation
    config_files: [template.yaml, cloudformation/]
  - name: devcontainer
    config_files: [.devcontainer/devcontainer.json]
  - name: nix
    config_files: [flake.nix, shell.nix]

databases:
  - name: postgresql
    deps: [pg, postgres, "@prisma/client", typeorm, knex, sequelize, sqlalchemy]
  - name: mysql
    deps: [mysql2, mysql]
  - name: mongodb
    deps: [mongodb, mongoose]
  - name: redis
    deps: [redis, ioredis]
  - name: sqlite
    deps: [better-sqlite3, sqlite3]

tools:
