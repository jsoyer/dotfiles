name: aictx Release

on:
  push:
    tags:
      - 'aictx-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: aictx-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: aictx-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: aictx-linux-x86_64-static
          - target: x86_64-apple-darwin
            os: macos-latest
            name: aictx-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: aictx-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: aictx-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/aictx

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/aictx.exe dist/${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/aictx dist/${{ matrix.name }}
            chmod +x dist/${{ matrix.name }}
          fi

      - name: Generate checksum
        run: |
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          elif command -v shasum &>/dev/null; then
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi
        shell: bash

      - name: Generate shell completions
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/aictx completions bash > dist/aictx.bash
          ./target/${{ matrix.target }}/release/aictx completions zsh > dist/_aictx
          ./target/${{ matrix.target }}/release/aictx completions fish > dist/aictx.fish

      - name: Generate man page
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/aictx man > dist/aictx.1

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: tools/aictx/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
