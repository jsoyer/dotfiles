name: cctx Release

on:
  push:
    tags:
      - 'cctx-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: cctx-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: cctx-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cctx-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cctx-macos-aarch64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/claude-context

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/claude-context dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Generate shell completions
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/claude-context completions bash > dist/cctx.bash
          ./target/${{ matrix.target }}/release/claude-context completions zsh > dist/_cctx
          ./target/${{ matrix.target }}/release/claude-context completions fish > dist/cctx.fish

      - name: Generate man page
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release/claude-context man > dist/cctx.1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tools/claude-context/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
